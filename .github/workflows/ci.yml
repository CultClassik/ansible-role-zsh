name: Ansible CI

on:
  workflow_dispatch: # leave this here so other repos can run manually
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

jobs:
  default:
    uses: Diehlabs/shared-workflows/.github/workflows/ansible-ci.yml@v0.2.1

  user:
    uses: Diehlabs/shared-workflows/.github/workflows/ansible-ci.yml@v0.2.1
    with:
      scenario: user

  shared:
    uses: Diehlabs/shared-workflows/.github/workflows/ansible-ci.yml@v0.2.1
    with:
      scenario: shared
