---
driver:
  name: docker
platforms:
  - name: ansible-role-zsh-debian-12
    image: geerlingguy/docker-debian12-ansible
    pre_build_image: true

  - name: ansible-role-zsh-ubuntu-2204
    image: geerlingguy/docker-ubuntu2204-ansible
    pre_build_image: true

  - name: ansible-role-zsh-ubuntu-2404
    image: geerlingguy/docker-ubuntu2404-ansible
    pre_build_image: true

  - name: ansible-role-zsh-rockylinux-9
    image: geerlingguy/docker-rockylinux9-ansible
    pre_build_image: true

#driver:
#  name: vagrant
#  provider:
#    name: virtualbox
#platforms:
#  - name: xenial64
#    box: bento/ubuntu-16.04

#verifier:
#  name: testinfra

provisioner:
  name: ansible
  env:
    # Molecule stopped symlinking this checkout under its own directory
    # name (molecule/molecule#3806-adjacent change), which is what let
    # converge.yml resolve `roles: - ansible-role-zsh` implicitly.
    # ../../.. from here (molecule/default/) is this repo's parent
    # directory, so Ansible can resolve the checkout itself as a role
    # named after its directory again.
    ANSIBLE_ROLES_PATH: ../../..
  playbooks:
    prepare: ../resources/prepare.yml
    converge: ../resources/converge.yml
  inventory:
    group_vars:
      all:
        zsh_user: root
        zsh_mc_solarized_skin: yes
        zsh_antigen_bundles_extras:
          - { name: test/in-list, when: true }
          - { name: test/not-in-list, when: false }
          - { name: test/command-exists, command: zsh }
          - { name: test/command-not-exists, command: not-exists-commanddd }
